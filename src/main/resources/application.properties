# Railway (and most PaaS) inject PORT; fall back to 8083 for local dev.
server.port=${PORT:8083}

# Postgres (shared instance; MF tables created by ddl-auto). Reuses the same env as lead-service.
spring.datasource.url=${LEADS_DB_URL:jdbc:postgresql://localhost:5432/leads}
spring.datasource.username=${LEADS_DB_USER:postgres}
spring.datasource.password=${LEADS_DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# HS256 JWT verification. JWT_SECRET MUST match crm-auth-service / lead-service.
app.jwt.secret=${JWT_SECRET:dev-insecure-shared-secret-change-me-please-32+bytes!!}

# Browser CORS — locked to the frontend origin in production (default * for local dev).
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:*}
