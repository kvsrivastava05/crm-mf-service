# Tests run against in-memory H2 (PostgreSQL mode) — no external database needed.
spring.datasource.url=jdbc:h2:mem:mftest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

app.jwt.secret=test-secret-test-secret-test-secret-32bytes!!
app.cors.allowed-origin=*
